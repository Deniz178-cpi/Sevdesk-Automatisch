<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Rechnung diktieren</title>
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #dfe3ea; --accent: #2f6fde; --accent-text: #ffffff; --danger: #d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1c2129; --text: #e7eaf0; --muted: #9aa3b2; --border: #2e3541; --accent: #5b8ff0; --accent-text: #0d1117; --danger: #f07070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .error { color: var(--danger); margin: 12px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Rechnung diktieren</h1>
  <label for="password">Passwort</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Anmelden</button>
  <p id="error" class="error" hidden></p>
</form>
<script>
  const reason = new URLSearchParams(location.search).get("fehler");
  const messages = {
    falsch: "Falsches Passwort.",
    gesperrt: "Zu viele Fehlversuche. Bitte in 15 Minuten erneut versuchen.",
  };
  if (messages[reason]) {
    const box = document.getElementById("error");
    box.textContent = messages[reason];
    box.hidden = false;
  }
</script>
</body>
</html>
